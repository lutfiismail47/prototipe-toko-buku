<!doctype html>
<html>
  <head>
    <meta charset="utf8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <style>
      :root {
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        padding: 0;
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: #fff;
        color: #000;
      }
      img {
        max-width: 100%;
      }
      [hidden]:not([hidden="until-found" i]) {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <title>Pustaka Ilmu Prototipe</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Patrick+Hand&display=swap"
    />
    <style>
      /* Layout: wireframe abu-abu, satu aksen biru hanya untuk elemen yang bisa diklik. Mode Pelanggan (header + konten) dan Admin (sidebar + konten). */
      :root {
        --bg: #eef0f3;
        --surface: #ffffff;
        --fill: #dfe3ea;
        --line: #8f98a6;
        --line-soft: #c9ced8;
        --fg: #1b2230;
        --muted: #5f6b7c;
        --accent: #2f5bea;
        --accent-fg: #ffffff;
        --ok: #2f7d4f;
        --ok-bg: #dff1e6;
        --warn: #9a5b00;
        --warn-bg: #fbebc8;
        --info: #2f5bea;
        --info-bg: #dfe7fd;
        --font-display: "Patrick Hand", "Comic Sans MS", cursive;
        --font-body:
          "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #14181f;
          --surface: #1d232d;
          --fill: #2b3340;
          --line: #6f7a8a;
          --line-soft: #363f4d;
          --fg: #e6e9ef;
          --muted: #9aa4b4;
          --accent: #7b9bff;
          --accent-fg: #101522;
          --ok: #6fd09a;
          --ok-bg: #1d3a2a;
          --warn: #f0b95a;
          --warn-bg: #42330f;
          --info: #7b9bff;
          --info-bg: #222e55;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #14181f;
        --surface: #1d232d;
        --fill: #2b3340;
        --line: #6f7a8a;
        --line-soft: #363f4d;
        --fg: #e6e9ef;
        --muted: #9aa4b4;
        --accent: #7b9bff;
        --accent-fg: #101522;
        --ok: #6fd09a;
        --ok-bg: #1d3a2a;
        --warn: #f0b95a;
        --warn-bg: #42330f;
        --info: #7b9bff;
        --info-bg: #222e55;
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 var(--font-body);
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        padding-block: 0 40px;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0 0 auto;
        height: env(safe-area-inset-top, 0px);
        z-index: 30;
        background: var(--fg);
      }
      h1,
      h2,
      h3 {
        font-family: var(--font-display);
        font-weight: 400;
        margin: 0;
        line-height: 1.15;
        text-wrap: balance;
      }
      h1 {
        font-size: 30px;
      }
      h2 {
        font-size: 24px;
      }
      h3 {
        font-size: 19px;
      }
      p {
        margin: 0;
      }
      a {
        color: inherit;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .proto {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 20;
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        background: var(--fg);
        color: var(--bg);
        padding: 8px 14px;
        margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 18px;
        font-family: var(--font-mono);
        font-size: 12px;
      }
      .proto .seg {
        display: flex;
        border: 1px solid var(--bg);
      }
      .proto .seg button {
        background: transparent;
        color: var(--bg);
        border: 0;
        padding: 4px 12px;
        cursor: pointer;
        font-family: var(--font-mono);
        font-size: 12px;
      }
      .proto .seg button[aria-pressed="true"] {
        background: var(--bg);
        color: var(--fg);
      }
      .proto .seg button:focus-visible {
        outline-color: var(--bg);
      }
      .shell {
        max-width: 1120px;
        margin: 0 auto;
      }

      /* kontrol */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border: 1.5px solid var(--fg);
        background: var(--surface);
        padding: 6px 14px;
        cursor: pointer;
        min-height: 34px;
        text-decoration: none;
        font-weight: 500;
      }
      .btn:hover {
        background: var(--fill);
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-fg);
      }
      .btn.primary:hover {
        filter: brightness(1.08);
      }
      .btn.sm {
        min-height: 28px;
        padding: 2px 10px;
        font-size: 13px;
      }
      .btn.danger {
        border-color: var(--warn);
        color: var(--warn);
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .link {
        background: none;
        border: 0;
        padding: 0;
        color: var(--accent);
        text-decoration: underline;
        cursor: pointer;
      }
      input,
      select,
      textarea {
        width: 100%;
        border: 1.5px solid var(--line);
        background: var(--surface);
        padding: 7px 10px;
        min-height: 36px;
        border-radius: 0;
      }
      textarea {
        min-height: 90px;
        resize: vertical;
      }
      label {
        display: block;
        font-size: 12px;
        font-family: var(--font-mono);
        color: var(--muted);
        margin-bottom: 3px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .field {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
      }
      .box {
        background: var(--surface);
        border: 1.5px solid var(--line);
        padding: 16px;
      }
      .dash {
        border-style: dashed;
      }
      .muted {
        color: var(--muted);
      }
      .mono {
        font-family: var(--font-mono);
      }
      .price {
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .between {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .wrapflex {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .screen-tag {
        margin-top: 28px;
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--muted);
        border-top: 1px dashed var(--line-soft);
        padding-top: 8px;
      }
      .note {
        font-size: 12px;
        color: var(--muted);
        font-family: var(--font-mono);
      }

      /* sampul */
      .cover {
        position: relative;
        aspect-ratio: 3/4;
        border: 1.5px solid var(--line);
        width: 100%;
        background:
          linear-gradient(
            to top right,
            transparent calc(50% - 0.75px),
            var(--line) 50%,
            transparent calc(50% + 0.75px)
          ),
          linear-gradient(
            to bottom right,
            transparent calc(50% - 0.75px),
            var(--line) 50%,
            transparent calc(50% + 0.75px)
          ),
          var(--fill);
      }
      .cover span {
        position: absolute;
        left: 6px;
        right: 6px;
        bottom: 6px;
        background: var(--surface);
        border: 1px solid var(--line);
        padding: 2px 5px;
        font-size: 11px;
        line-height: 1.25;
      }
      .cover.mini {
        width: 34px;
        aspect-ratio: 3/4;
      }
      .cover.mini span {
        display: none;
      }

      /* header pelanggan */
      .top {
        background: var(--surface);
        border: 1.5px solid var(--line);
        padding: 12px 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px 20px;
        align-items: center;
        margin-bottom: 20px;
      }
      .logo {
        font-family: var(--font-display);
        font-size: 26px;
        cursor: pointer;
        background: none;
        border: 0;
        padding: 0;
      }
      .logo em {
        font-style: normal;
        border: 1.5px solid var(--fg);
        padding: 0 6px;
        margin-right: 6px;
      }
      .nav {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .nav button {
        background: none;
        border: 0;
        padding: 4px 10px;
        cursor: pointer;
        border-bottom: 2px solid transparent;
      }
      .nav button[aria-current="page"] {
        border-bottom-color: var(--fg);
        font-weight: 600;
      }
      .nav button:hover {
        background: var(--fill);
      }
      .search {
        display: flex;
        flex: 1 1 220px;
        min-width: 0;
      }
      .search input {
        border-right: 0;
      }
      .userbar {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin-left: auto;
      }
      .count {
        display: inline-block;
        min-width: 20px;
        text-align: center;
        background: var(--fg);
        color: var(--bg);
        border-radius: 10px;
        font-size: 12px;
        padding: 0 6px;
      }

      /* beranda */
      .banner {
        border: 1.5px solid var(--line);
        min-height: 210px;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
        position: relative;
        background:
          linear-gradient(
            to top right,
            transparent calc(50% - 0.75px),
            var(--line-soft) 50%,
            transparent calc(50% + 0.75px)
          ),
          linear-gradient(
            to bottom right,
            transparent calc(50% - 0.75px),
            var(--line-soft) 50%,
            transparent calc(50% + 0.75px)
          ),
          var(--fill);
      }
      .banner .txt {
        background: var(--surface);
        border: 1.5px solid var(--line);
        padding: 14px 22px;
        max-width: 480px;
      }
      .dots {
        display: flex;
        gap: 6px;
        justify-content: center;
        margin-top: 8px;
      }
      .dots button {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 1.5px solid var(--fg);
        background: var(--surface);
        padding: 0;
        cursor: pointer;
      }
      .dots button[aria-current="true"] {
        background: var(--fg);
      }
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .chip {
        border: 1.5px solid var(--line);
        background: var(--surface);
        padding: 3px 12px;
        cursor: pointer;
        border-radius: 16px;
      }
      .chip:hover,
      .chip[aria-pressed="true"] {
        background: var(--fg);
        color: var(--bg);
        border-color: var(--fg);
      }
      .grid-books {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 16px;
      }
      .card {
        display: flex;
        flex-direction: column;
        gap: 6px;
        cursor: pointer;
        min-width: 0;
      }
      .card .t {
        font-weight: 600;
        line-height: 1.3;
      }
      .card .a {
        font-size: 12.5px;
        color: var(--muted);
      }
      .card .btn {
        margin-top: 4px;
      }
      .rank {
        font-family: var(--font-display);
        font-size: 22px;
        line-height: 1;
      }
      .sec-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        margin: 26px 0 12px;
      }

      /* katalog */
      .cat-layout {
        display: grid;
        grid-template-columns: 230px minmax(0, 1fr);
        gap: 20px;
        align-items: start;
      }
      @media (max-width: 760px) {
        .cat-layout {
          grid-template-columns: 1fr;
        }
      }
      .check {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 14px;
        text-transform: none;
        letter-spacing: 0;
        font-family: var(--font-body);
        color: var(--fg);
      }
      .check input {
        width: auto;
        min-height: 0;
      }

      /* detail */
      .detail {
        display: grid;
        grid-template-columns: minmax(0, 280px) minmax(0, 1fr);
        gap: 28px;
      }
      @media (max-width: 700px) {
        .detail {
          grid-template-columns: 1fr;
        }
        .detail .cover {
          max-width: 240px;
        }
      }
      .meta {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 16px;
        font-size: 13.5px;
      }
      .meta dt {
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 12px;
        padding-top: 1px;
      }
      .meta dd {
        margin: 0;
      }
      .qty {
        display: inline-flex;
        border: 1.5px solid var(--fg);
      }
      .qty button {
        width: 32px;
        border: 0;
        background: var(--surface);
        cursor: pointer;
        font-size: 16px;
      }
      .qty button:hover {
        background: var(--fill);
      }
      .qty output {
        min-width: 36px;
        display: grid;
        place-items: center;
        border-inline: 1.5px solid var(--fg);
        font-variant-numeric: tabular-nums;
      }

      /* tabel */
      .tblwrap {
        overflow-x: auto;
        border: 1.5px solid var(--line);
        background: var(--surface);
      }
      table {
        border-collapse: collapse;
        width: 100%;
        min-width: 560px;
      }
      th {
        font-family: var(--font-mono);
        font-size: 11.5px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        text-align: left;
        color: var(--muted);
        background: var(--fill);
        padding: 8px 12px;
        white-space: nowrap;
      }
      td {
        padding: 9px 12px;
        border-top: 1px solid var(--line-soft);
        vertical-align: middle;
      }
      td.num,
      th.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      td .wrapflex {
        flex-wrap: nowrap;
      }
      .badge {
        display: inline-block;
        padding: 1px 10px;
        border: 1.5px solid currentColor;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }
      .b-Diproses {
        color: var(--warn);
        background: var(--warn-bg);
      }
      .b-Dikirim {
        color: var(--info);
        background: var(--info-bg);
      }
      .b-Selesai {
        color: var(--ok);
        background: var(--ok-bg);
      }
      .b-Aktif {
        color: var(--ok);
        background: var(--ok-bg);
      }
      .b-Nonaktif {
        color: var(--muted);
        background: var(--fill);
      }
      .b-low {
        color: var(--warn);
        background: var(--warn-bg);
      }
      .b-ok {
        color: var(--ok);
        background: var(--ok-bg);
      }

      /* checkout / keranjang */
      .two {
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
        gap: 20px;
        align-items: start;
      }
      @media (max-width: 760px) {
        .two {
          grid-template-columns: 1fr;
        }
      }
      .sum {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 3px 0;
      }
      .sum.total {
        border-top: 1.5px solid var(--fg);
        margin-top: 6px;
        padding-top: 8px;
        font-weight: 600;
        font-size: 16px;
      }
      .radio {
        display: flex;
        gap: 8px;
        align-items: center;
        border: 1.5px solid var(--line);
        padding: 8px 10px;
        cursor: pointer;
        text-transform: none;
        letter-spacing: 0;
        font-family: var(--font-body);
        font-size: 14px;
        color: var(--fg);
        margin: 0;
      }
      .radio input {
        width: auto;
        min-height: 0;
      }
      .empty {
        text-align: center;
        padding: 40px 16px;
        border: 1.5px dashed var(--line);
      }
      .authbox {
        max-width: 420px;
        margin: 20px auto;
      }

      /* admin */
      .admin {
        display: grid;
        grid-template-columns: 200px minmax(0, 1fr);
        gap: 20px;
        align-items: start;
      }
      @media (max-width: 760px) {
        .admin {
          grid-template-columns: 1fr;
        }
      }
      .side {
        background: var(--surface);
        border: 1.5px solid var(--line);
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      @media (max-width: 760px) {
        .side {
          flex-direction: row;
          flex-wrap: wrap;
        }
      }
      .side .brand {
        font-family: var(--font-display);
        font-size: 22px;
        padding: 2px 8px 10px;
        width: 100%;
      }
      .side button {
        text-align: left;
        background: none;
        border: 0;
        padding: 7px 10px;
        cursor: pointer;
        border-left: 3px solid transparent;
      }
      .side button:hover {
        background: var(--fill);
      }
      .side button[aria-current="page"] {
        border-left-color: var(--fg);
        background: var(--fill);
        font-weight: 600;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 14px;
      }
      .stat {
        border: 1.5px solid var(--line);
        background: var(--surface);
        padding: 14px 16px;
      }
      .stat .k {
        font-family: var(--font-mono);
        font-size: 11.5px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
      }
      .stat .v {
        font-family: var(--font-display);
        font-size: 34px;
        line-height: 1.1;
        margin-top: 2px;
        font-variant-numeric: tabular-nums;
      }
      .tabs {
        display: flex;
        gap: 0;
        flex-wrap: wrap;
      }
      .tabs button {
        border: 1.5px solid var(--line);
        margin-right: -1.5px;
        background: var(--surface);
        padding: 5px 14px;
        cursor: pointer;
      }
      .tabs button[aria-pressed="true"] {
        background: var(--fg);
        color: var(--bg);
        border-color: var(--fg);
      }
      .toast {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        background: var(--fg);
        color: var(--bg);
        padding: 8px 16px;
        z-index: 40;
        font-size: 13px;
        max-width: 90vw;
      }
      @media (prefers-reduced-motion: no-preference) {
        .toast {
          animation: pop 0.2s ease-out;
        }
        @keyframes pop {
          from {
            opacity: 0;
            transform: translate(-50%, 8px);
          }
        }
      }
    </style>

    <div id="app"></div>

    <script>
      const fmt = (n) => "Rp " + Number(n).toLocaleString("id-ID");
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const $ = (s) => document.querySelector(s);

      const S = {
        mode: "cust",
        screen: "home",
        id: null,
        redirect: null,
        user: null,
        admin: false,
        admScreen: "dash",
        cart: [
          { id: 1, qty: 1 },
          { id: 5, qty: 2 },
        ],
        qty: 1,
        banner: 0,
        q: "",
        cat: "",
        sort: "baru",
        onlyStock: false,
        lastOrder: null,
        toast: "",
        editBook: null,
        delBook: null,
        bookQ: "",
        editCat: null,
        ordTab: "Semua",
        custView: null,
        cats: [
          { id: 1, name: "Fiksi" },
          { id: 2, name: "Anak" },
          { id: 3, name: "Teknologi" },
          { id: 4, name: "Kuliner" },
          { id: 5, name: "Pengembangan Diri" },
          { id: 6, name: "Sejarah" },
          { id: 7, name: "Bisnis" },
        ],
        books: [
          {
            id: 1,

            (!S.cat || b.cat === S.cat) &&

      /* ---------- Render & event ---------- */
      function render() {
        const keep = document.activeElement?.id;
        $("#app").innerHTML =
          `<div class="proto"><span>PROTOTIPE LOW-FI · Pustaka Ilmu · data contoh</span>
    <div class="seg" role="group" aria-label="Pilih tampilan"><button data-act="mode" data-m="cust" aria-pressed="${S.mode === "cust"}">Pelanggan</button><button data-act="mode" data-m="admin" aria-pressed="${S.mode === "admin"}">Admin</button></div></div>
    ${S.mode === "cust" ? custShell() : adminShell()}${S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : ""}`;
        if (keep) {
          const el = document.getElementById(keep);
          if (el && el.focus) {
            el.focus();
            try {
              const l = el.value.length;
              el.setSelectionRange(l, l);
            } catch (e) {}
          }
        }
      }
      function addToCart(id, n = 1) {
        const b = book(id);
        if (!b || b.stock === 0) return;
        const it = S.cart.find((i) => i.id === id);
        if (it) it.qty = Math.min(b.stock, it.qty + n);
        else S.cart.push({ id, qty: Math.min(b.stock, n) });
      }
      function afterLogin() {
        const r = S.redirect;
        S.redirect = null;
        go(r || "home");
      }

      document.addEventListener("click", (e) => {
        const el = e.target.closest("[data-act]");
        if (!el) return;
        const a = el.dataset.act,
          id = Number(el.dataset.id);
        switch (a) {
          case "mode":
            S.mode = el.dataset.m;
            render();
            break;
          case "go":
            go(el.dataset.to);
            break;
          case "detail":
            go("detail", id);
            break;
          case "banner":
            S.banner = id;
            render();
            break;
          case "catfilter":
            S.cat = el.dataset.cat;
            S.q = "";
            go("catalog");
            break;
          case "reset":
            S.q = "";
            S.cat = "";
            S.sort = "baru";
            S.onlyStock = false;
            render();
            break;
          case "qty":
            S.qty = Math.max(1, S.qty + Number(el.dataset.d));
            render();
            break;
          case "add":
            addToCart(id, Number(el.dataset.qty) || 1);
            toast("Ditambahkan ke keranjang");
            break;
          case "buy":
            addToCart(id, S.qty);
            go("cart");
            break;
          case "cinc":
            addToCart(id, 1);
            render();
            break;
          case "cdec": {
            const it = S.cart.find((i) => i.id === id);
            if (it) {
              it.qty--;
              if (it.qty < 1) S.cart = S.cart.filter((i) => i !== it);
            }
            render();
            break;
          }
          case "crm":
            S.cart = S.cart.filter((i) => i.id !== id);
            render();
            break;
          case "checkout":
            if (!S.user) {
              S.redirect = "checkout";
              go("login");
            } else go("checkout");
            break;
          case "logout":
            S.user = null;
            go("home");
            break;
          /* admin */
          case "admGo":
            S.admScreen = el.dataset.to;
            S.editBook = null;
            S.delBook = null;
            S.editCat = null;
            render();
            break;
          case "admLogout":
            S.admin = false;
            render();
            break;
          case "bookNew":
            S.editBook = "new";
            render();
            window.scrollTo(0, 0);
            break;
          case "bookEdit":
            S.editBook = id;
            render();
            window.scrollTo(0, 0);
            break;
          case "bookCancel":
            S.editBook = null;
            render();
            break;
          case "bookDel":
            S.delBook = id;
            render();
            break;
          case "bookDelNo":
            S.delBook = null;
            render();
            break;
          case "bookDelYes":
            if (S.orders.some((o) => o.items.some((i) => i.id === id))) {
              S.delBook = null;
              toast("Tidak bisa dihapus: buku ada di riwayat pesanan");
              break;
            }
            S.books = S.books.filter((b) => b.id !== id);
            S.cart = S.cart.filter((i) => i.id !== id);
            S.delBook = null;
            toast("Buku dihapus");
            break;
          case "catEdit":
            S.editCat = id;
            render();
            break;
          case "catCancel":
            S.editCat = null;
            render();
            break;
          case "catDel": {
            const c = S.cats.find((x) => x.id === id);
            const n = S.books.filter((b) => b.cat === c.name).length;
            if (n) toast(`Tidak bisa dihapus: dipakai ${n} buku`);
            else {
              S.cats = S.cats.filter((x) => x.id !== id);
              toast("Kategori dihapus");
            }
            break;
          }
          case "ordTab":
            S.ordTab = el.dataset.tab;
            render();
            break;
          case "custView":
            S.custView = id || null;
            render();
            break;
          case "custToggle": {
            const c = cust(id);
            c.active = !c.active;
            render();
            break;
          }
        }
      });
      document.addEventListener("keydown", (e) => {
        if ((e.key === "Enter" || e.key === " ") && e.target.matches(".card")) {
          e.preventDefault();
          go("detail", Number(e.target.dataset.id));
        }
      });

      document.addEventListener("input", (e) => {
        const f = e.target.dataset.filter;
        if (!f) return;
        const v =
          e.target.type === "checkbox" ? e.target.checked : e.target.value;
        if (f === "bookQ") {
          S.bookQ = v;
          render();
          return;
        }
        S[f] = v;
        const r = $("#cat-results");
        if (r) r.innerHTML = catalogList();
      });
      document.addEventListener("change", (e) => {
        const t = e.target;
        if (t.dataset.ordstatus) {
          const o = S.orders.find((x) => x.id === t.dataset.ordstatus);
          o.status = t.value;
          toast(`${o.id} → ${o.status}`);
          return;
        }
        if (t.dataset.actChange === "ship") {
          const s = COURIERS[t.value];
          $("#ship-val").textContent = fmt(s);
          $("#tot-val").textContent = fmt(cartSub() + s);
          return;
        }
        if (t.dataset.filter)
          t.dispatchEvent(new Event("input", { bubbles: true }));
      });

      document.addEventListener("submit", (e) => {
        const form = e.target.closest("form[data-form]");
        if (!form) return;
        e.preventDefault();
        const d = Object.fromEntries(new FormData(form));
        switch (form.dataset.form) {
          case "search":
            S.q = $("#hdr-q").value;
            S.cat = "";
            go("catalog");
            break;
          case "login":
            S.user =
              S.customers.find((c) => c.email === d.email) || S.customers[0];
            afterLogin();
            break;
          case "register": {
            const c = {
              id: Math.max(...S.customers.map((x) => x.id)) + 1,
              name: d.name,
              email: d.email,
              phone: d.phone,
              city: "",
              active: true,
            };
            S.customers.push(c);
            S.user = c;
            afterLogin();
            break;
          }
          case "checkout": {
            const n = S.orders.length
              ? Math.max(...S.orders.map((o) => Number(o.id.split("-")[1]))) + 1
              : 1001;
            const o = {
              id: "PK-" + n,
              cust: S.user.id,
              items: S.cart.map((i) => ({ ...i })),
              ship: COURIERS[d.courier],
              status: "Diproses",
              date: "4 Nov 2026",
            };
            o.items.forEach((i) => {
              const b = book(i.id);
              b.stock = Math.max(0, b.stock - i.qty);
            });
            S.orders.push(o);
            S.cart = [];
            S.lastOrder = o.id;
            go("success");
            break;
          }
          case "contact":
            form.reset();
            toast("Pesan terkirim (contoh)");
            break;
          case "adminLogin":
            S.admin = true;
            S.admScreen = "dash";
            render();
            break;
          case "bookForm": {
            const p = {
              title: d.title,
              author: d.author,
              publisher: d.publisher,
              cat: d.cat,
              price: Number(d.price),
              stock: Number(d.stock),
              syn: d.syn,
            };
            if (S.editBook === "new")
              S.books.push({
                id: Math.max(0, ...S.books.map((b) => b.id)) + 1,
                year: 2026,
                pages: 0,
                isNew: true,
                best: false,
                ...p,
              });
            else Object.assign(book(S.editBook), p);
            S.editBook = null;
            toast("Buku disimpan");
            break;
          }
          case "catAdd": {
            const name = d.name.trim();
            if (
              S.cats.some((c) => c.name.toLowerCase() === name.toLowerCase())
            ) {
              toast("Kategori sudah ada");
              break;
            }
            S.cats.push({
              id: Math.max(0, ...S.cats.map((c) => c.id)) + 1,
              name,
            });
            toast("Kategori ditambahkan");
            break;
          }
          case "catEdit": {
            const c = S.cats.find((x) => x.id === Number(form.dataset.id));
            const old = c.name;
            c.name = d.name.trim();
            S.books.forEach((b) => {
              if (b.cat === old) b.cat = c.name;
            });
            S.editCat = null;
            toast("Kategori diperbarui");
            break;
          }
        }
      });
      render();
    </script>
  </body>
</html>
